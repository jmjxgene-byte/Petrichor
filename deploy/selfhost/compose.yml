name: petrichor

services:
  web:
    build:
      context: ../..
      dockerfile: Dockerfile.selfhost
    image: petrichor-web:${PETRICHOR_IMAGE_TAG:-local}
    env_file:
      - ${PETRICHOR_ENV_FILE:-./.env.production}
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "const response = await fetch('http://127.0.0.1:3000/healthz'); if (!response.ok) process.exit(1)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - app

networks:
  app:
    driver: bridge
